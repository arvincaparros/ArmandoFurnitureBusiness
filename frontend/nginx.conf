server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing - any path nginx doesn't have a
    # real file for falls back to index.html so the SPA's own router
    # can handle it (otherwise refreshing on e.g. /dashboard 404s).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
